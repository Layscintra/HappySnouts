include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

formatter:
  page_width: 120

linter:
  rules:
    - directives_ordering
    - prefer_single_quotes
    - prefer_final_locals
    - sort_child_properties_last
