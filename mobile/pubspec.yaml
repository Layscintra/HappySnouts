name: happysnouts
description: App Happy Snouts - cuidados com pets, loja e dispositivos inteligentes.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^22.3.3
  flutter_map: ^8.3.2
  google_fonts: ^8.0.0
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.4
  latlong2: ^0.10.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
